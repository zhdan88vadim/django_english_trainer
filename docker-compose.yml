services:
  db:
    image: postgres:15.1
    environment:
      POSTGRES_DB: english_trainer
      POSTGRES_USER: trainer_user
      POSTGRES_PASSWORD: english_trainer_password
    volumes:
      - postgres_data_new:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro        
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer_user -d english_trainer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro        
    ports:
      - "6379:6379"

  flower:
    image: mher/flower:latest
    command: celery --broker=redis://redis:6379/0 flower --port=5555 --loglevel=info
    env_file:
      - .env    
    environment: 
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=admin:password123  # Optional: Basic auth
      - FLOWER_URL_PREFIX=/flower  # Optional: URL prefix
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_started
      celery:
        condition: service_started

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8090"
    # command: tail -f /dev/null
    image: django_english_trainer-web:latest
    volumes:
      - .:/code
      - chroma_data:/tmp/chroma_data
      - chroma_cache:/root/.cache/chroma
      - ./uploads:/code/uploads
      - ./outputs:/code/outputs            
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro          
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - OLLAMA_URL=http://host.docker.internal:11434
      - CHROMA_DATA_DIR=/tmp/chroma_data
    extra_hosts:
      - "host.docker.internal:host-gateway"      
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # ollama:
      #   condition: service_healthy

  celery:
    image: django_english_trainer-celery:latest
    build: .
    command: celery -A server.celery worker --loglevel=info
    volumes:
      - .:/code
      - ./uploads:/code/uploads
      - ./outputs:/code/outputs
      - chroma_data:/tmp/chroma_data
      - chroma_cache:/root/.cache/chroma
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro          
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0      
      - CELERY_RESULT_BACKEND=django-db
    extra_hosts:
      - "host.docker.internal:host-gateway"          
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # ollama:
      #   condition: service_healthy

  frontend:
    image: django-english-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react-frontend      
    command: npm run start
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    ports:
      - "3090:3000"
    env_file:
      - .env
    environment:
      - REACT_APP_API_URL=http://192.168.0.254:8090/api
      # - REACT_APP_API_URL=http://192.168.0.53:8090/api
    depends_on:
      - web

volumes:
  redis_data:
  postgres_data_new:
  # ollama_data:
  chroma_data:
  chroma_cache:
